services:
  sqlc:
    image: sqlc/sqlc:1.31.1
    volumes:
      - .:/src
    working_dir: /src
    command: generate

  templ:
    image: ghcr.io/a-h/templ:v0.3.1100
    volumes:
      - .:/app
    working_dir: /app
    command: generate

  hurl:
    image: ghcr.io/orange-opensource/hurl:latest
    profiles: [test]
    network_mode: service:api
    volumes:
      - ./requests.hurl:/tests/requests.hurl:ro
    command: ["--test", "/tests/requests.hurl"]

  go-tests:
    image: golang:1.26-alpine
    profiles: [test]
    network_mode: service:database
    volumes:
      - .:/src:ro
    working_dir: /src
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prueba}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: ["go", "test", "./...", "-v"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-prueba}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://localhost:8080/salud"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prueba}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
